<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Welcome back</ion-card-title>
      <ion-card-subtitle>Please sign in to continue</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input
          [(ngModel)]="username"
          label="Username"
          labelPlacement="floating"
          type="text"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [(ngModel)]="password"
          label="Password"
          labelPlacement="floating"
          type="password"
          required
        ></ion-input>
      </ion-item>

      <ion-button
        expand="block"
        class="ion-margin-top"
        (click)="onLogin()"
        [disabled]="loading"
      >
        {{ loading ? "Signing in…" : "Sign in" }}
      </ion-button>

      <ion-text *ngIf="error" color="danger" class="ion-margin-top">
        {{ error }}
      </ion-text>
    </ion-card-content>
  </ion-card>
</ion-content>
